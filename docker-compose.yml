version: "3.9"

services:
  sanitizer:
    build:
      context: .
      dockerfile: Dockerfile
    image: sanitizer:cpu
    container_name: sanitizer
    ports:
      - "${SANITIZER_API_PORT:-8000}:8000"
    environment:
      - SANITIZER_DEVICE=cpu
      - SANITIZER_FACE_BACKEND=ensemble
      - SANITIZER_OCR_BACKEND=easyocr
      - SANITIZER_OCR_LANGS=en
      - SANITIZER_MASK_MODE=blur
      - SANITIZER_BLUR_KERNEL=51
    volumes:
      - ./models:/app/models
      - ./outputs:/app/outputs
    restart: unless-stopped

