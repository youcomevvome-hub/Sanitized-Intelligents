[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sanitizer"
version = "0.1.0"
description = "Backend-agnostic PII anonymization engine (faces, IDs, numbers, names) for images, PDFs, DOCX, video and text."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
	"fastapi>=0.110.0",
	"python-multipart>=0.0.9",
	"pydantic>=2.6.0",
	"filetype>=1.2.0",
	"loguru>=0.7.2",
]

[tool.setuptools.packages.find]
include = ["sanitizer*", "api*"]
